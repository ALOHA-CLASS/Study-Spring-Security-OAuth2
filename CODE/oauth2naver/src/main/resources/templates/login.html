<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인</title>
  <style>
    @font-face {
    font-family: 'SeoulNotice';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2505-1@1.0/SeoulAlrimTTF-Medium.woff2') format('woff2');
    font-weight: 500;
    font-display: swap;
    }
    body { font-family: 'SeoulNotice'; margin: 50px; text-align: center; }
    .container { max-width: 400px; margin: 0 auto; }
    .naver-btn {
        display: inline-block;
        padding: 12px 24px;
        background-color: #FEE500;
        color: #000;
        text-decoration: none;
        border-radius: 8px;
        font-weight: bold;
        margin: 10px;
    }
    .naver-btn:hover { background-color: #FFDD00; }
     a { text-decoration:none; }
  </style>
</head>
<body>
<div class="container">
  <h2>로그인</h2>
  <p>네이버 계정으로 로그인하세요</p>
  <a href="/oauth2/authorization/naver" class="naver-btn">
    🟡 네이버로 로그인
  </a>
  <br><br>
  <a href="/">홈으로 돌아가기</a>
</div>
</body>
</html>
