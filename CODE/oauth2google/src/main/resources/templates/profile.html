<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>프로필</title>
  <style>
    @font-face {
    font-family: 'SeoulNotice';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2505-1@1.0/SeoulAlrimTTF-Medium.woff2') format('woff2');
    font-weight: 500;
    font-display: swap;
    }
    body { font-family: 'SeoulNotice'; margin: 50px; text-align: center; }
    .container { max-width: 500px; margin: 0 auto; }
    .profile-img { width: 100px; height: 100px; border-radius: 50%; margin: 20px; }
    .info { background-color: #f5f5f5; padding: 20px; border-radius: 8px; margin: 20px 0; }
    .btn { padding: 10px 20px; background-color: #007bff; color: white; text-decoration: none; border-radius: 5px; margin: 5px; }
    .logout-btn { background-color: #dc3545; }
    a { text-decoration:none; }
  </style>
</head>
<body>
<div class="container">
  <h2>프로필 정보</h2>
  <div th:if="${user}">
    <img th:src="${user.profileImageUrl}" alt="프로필 이미지" class="profile-img"
         th:if="${user.profileImageUrl != null and user.profileImageUrl != ''}">
    <div class="info">
      <p><strong>이름:</strong> <span th:text="${user.name}"></span></p>
      <p><strong>이메일:</strong> <span th:text="${user.email}"></span></p>
      <p><strong>ID:</strong> <span th:text="${user.id}"></span></p>
      <p><strong>권한:</strong> <span th:text="${user.role}"></span></p>
    </div>
  </div>
  <div th:unless="${user}">
    <p>로그인 정보를 찾을 수 없습니다.</p>
  </div>
  <a href="/" class="btn">홈으로</a>
  <a href="/logout" class="btn logout-btn">로그아웃</a>
</div>
</body>
</html>
