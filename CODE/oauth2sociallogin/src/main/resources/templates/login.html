<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>소셜 로그인</title>
  <style>
    * { box-sizing: border-box; }
    body {
        font-family: 'Arial', sans-serif;
        margin: 0;
        padding: 0;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .login-container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        padding: 40px;
        text-align: center;
        max-width: 400px;
        width: 100%;
        margin: 20px;
    }
    h2 {
        color: #333;
        margin-bottom: 30px;
        font-size: 2em;
        font-weight: 300;
    }
    .social-login-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 15px;
        margin: 15px 0;
        text-decoration: none;
        border-radius: 10px;
        font-weight: bold;
        font-size: 16px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    .google-btn {
        background: #4285f4;
        color: white;
        box-shadow: 0 4px 15px rgba(66, 133, 244, 0.3);
    }
    .google-btn:hover {
        background: #357ae8;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(66, 133, 244, 0.4);
    }
    .naver-btn {
        background: #03c75a;
        color: white;
        box-shadow: 0 4px 15px rgba(3, 199, 90, 0.3);
    }
    .naver-btn:hover {
        background: #02b351;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(3, 199, 90, 0.4);
    }
    .kakao-btn {
        background: #fee500;
        color: #3c1e1e;
        box-shadow: 0 4px 15px rgba(254, 229, 0, 0.3);
    }
    .kakao-btn:hover {
        background: #fdd835;
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(254, 229, 0, 0.4);
    }
    .btn-icon {
        display: inline-block;
        width: 20px;
        height: 20px;
        margin-right: 10px;
        vertical-align: middle;
    }
    .back-btn {
        margin-top: 30px;
        padding: 10px 20px;
        background: transparent;
        border: 2px solid #667eea;
        color: #667eea;
        text-decoration: none;
        border-radius: 25px;
        transition: all 0.3s ease;
    }
    .back-btn:hover {
        background: #667eea;
        color: white;
    }
    .error-message {
        color: #d32f2f;
        background: #ffebee;
        padding: 10px;
        border-radius: 5px;
        margin-bottom: 20px;
        border-left: 4px solid #d32f2f;
    }
  </style>
</head>
<body>
<div class="login-container">
  <h2>소셜 로그인</h2>

  <div th:if="${param.error}" class="error-message">
    로그인 중 오류가 발생했습니다. 다시 시도해주세요.
  </div>

  <a href="/oauth2/authorization/google" class="social-login-btn google-btn">
    <span class="btn-icon">📧</span>
    Google로 로그인
  </a>

  <a href="/oauth2/authorization/naver" class="social-login-btn naver-btn">
    <span class="btn-icon">🟢</span>
    Naver로 로그인
  </a>

  <a href="/oauth2/authorization/kakao" class="social-login-btn kakao-btn">
    <span class="btn-icon">💬</span>
    Kakao로 로그인
  </a>

  <a href="/" class="back-btn">홈으로 돌아가기</a>
</div>
</body>
</html>
